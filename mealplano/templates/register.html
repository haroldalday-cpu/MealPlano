{% extends "base.html" %}
{% block title %}Create account · MealPLANO{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username"
           minlength="3" maxlength="30" required></label>
    <label>Password <input name="password" type="password" autocomplete="new-password"
           minlength="8" required></label>
    <label>Confirm password <input name="confirm" type="password" autocomplete="new-password"
           minlength="8" required></label>
    <p class="muted">At least 8 characters.</p>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
